openapi: 3.1.0
info:
  title: Topsell Checkout API
  version: "1.0.0"
  description: |
    Dokumentasi API yang dipakai custom checkout **store-topsell-next**.

    Disusun dari kontrak yang dibaca frontend dan diimplementasikan di API lokal
    (`topsell-local-api`). Backend asli bisa punya field tambahan; field di sini adalah
    yang **dipakai frontend**.

    **Format respons:** hampir semua endpoint membungkus hasilnya:
    `{ "status": 200, "message": "OK", "data": ... }`. Error memakai bentuk yang sama
    tanpa `data`, dengan HTTP status sesuai (`400`, `401`, `404`, `409`, `502`).

    **Login:** endpoint bertanda gembok butuh header `Authorization: Bearer <token>`
    (token dari `POST /users/verify-otp`).

    **API lokal:** OTP selalu `1234`, captcha diabaikan, pembayaran tidak sungguhan.
    Produk asli dari WooCommerce, alamat/ongkir/tracking dari Biteship (sandbox), data di Postgres.
servers:
  - url: http://localhost:8080/api/v1
    description: API lokal (local-api)
tags:
  - name: Pengaturan
  - name: Produk
  - name: Akun & Login
  - name: Keranjang
  - name: Stok Cabang
  - name: Alamat
  - name: Pengiriman
  - name: Voucher
  - name: Checkout & Pesanan
  - name: Poin
  - name: Khusus Lokal
    description: Hanya ada di API lokal untuk keperluan tes. Tidak ada di backend asli.

security: []

paths:
  /app-settings:
    get:
      tags: [Pengaturan]
      summary: Pengaturan toko
      description: Banner halaman login, pixel iklan, dan script tambahan. Dipakai root layout (di-cache 5 menit).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/AppSettings" }

  /products/{productId}:
    get:
      tags: [Produk]
      summary: Detail produk
      description: |
        Data produk dari WooCommerce. Dengan `variation_id`, harga diambil dari variasi
        dan `name` berisi nama variasi.

        **Catatan harga:** `price` = harga coret (asli), `regularPrice` = harga jual yang dibayar.
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string }, example: "271593" }
        - { name: variation_id, in: query, schema: { type: string }, example: "302610" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Product" }
        "502": { $ref: "#/components/responses/Upstream" }

  /recommendations:
    get:
      tags: [Produk]
      summary: Rekomendasi produk (tamu)
      responses:
        "200": { $ref: "#/components/responses/Recommendations" }

  /carts/recommendations:
    get:
      tags: [Produk]
      summary: Rekomendasi produk (user login)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Recommendations" }

  /users/register:
    post:
      tags: [Akun & Login]
      summary: Daftar akun baru
      description: Membuat user + bonus 20.000 poin member baru, lalu mengirim OTP. Captcha lewat header `X-Captcha-Token`.
      parameters:
        - { name: X-Captcha-Token, in: header, schema: { type: string }, description: Token Cloudflare Turnstile }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phoneNumber]
              properties:
                fullName: { type: string, example: Tes Lokal }
                email: { type: string, example: tes@lokal.test }
                phoneNumber: { type: string, example: "6281200000001", description: "Format 62xxx" }
                website: { type: string, description: Honeypot anti-bot, harus kosong }
      responses:
        "200": { $ref: "#/components/responses/OkNull" }
        "409": { $ref: "#/components/responses/Error", description: Nomor sudah terdaftar }

  /users/login:
    post:
      tags: [Akun & Login]
      summary: Kirim OTP login
      parameters:
        - { name: X-Captcha-Token, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneBody" }
      responses:
        "200": { $ref: "#/components/responses/OkNull" }
        "404": { $ref: "#/components/responses/Error", description: Nomor belum terdaftar }

  /users/resend-otp:
    post:
      tags: [Akun & Login]
      summary: Kirim ulang OTP
      parameters:
        - { name: X-Captcha-Token, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneBody" }
      responses:
        "200": { $ref: "#/components/responses/OkNull" }
        "404": { $ref: "#/components/responses/Error" }

  /users/verify-otp:
    post:
      tags: [Akun & Login]
      summary: Verifikasi OTP & dapatkan token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, otp]
              properties:
                phoneNumber: { type: string, example: "6281200000001" }
                otp: { type: string, example: "1234", description: OTP 4 digit }
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error", description: OTP salah }

  /users/me:
    get:
      tags: [Akun & Login]
      summary: Profil user login
      description: Juga dipakai SessionGuard untuk mengecek token masih berlaku (401 = keluar otomatis).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/profile:
    get:
      tags: [Akun & Login]
      summary: Profil user login (alias)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/email:
    put:
      tags: [Akun & Login]
      summary: Ubah email
      description: Email baru berstatus belum tervalidasi.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailBody" }
      responses:
        "200": { $ref: "#/components/responses/OkNull" }
        "400": { $ref: "#/components/responses/Error", description: Format email salah }

  /users/send-email-validation:
    post:
      tags: [Akun & Login]
      summary: Kirim link validasi email
      description: API lokal tidak mengirim email; link ditulis di log server.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailBody" }
      responses:
        "200": { $ref: "#/components/responses/OkNull" }

  /users/validate-email:
    get:
      tags: [Akun & Login]
      summary: Validasi email dari link
      description: Link sekali pakai.
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OkNull" }
        "400": { $ref: "#/components/responses/Error", description: Link tidak valid / sudah dipakai }

  /carts:
    get:
      tags: [Keranjang]
      summary: Isi keranjang
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Cart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Keranjang]
      summary: Kosongkan keranjang
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/OkNull" }

  /carts/items:
    post:
      tags: [Keranjang]
      summary: Tambah produk ke keranjang
      description: Produk + variasi yang sama menambah `qty` baris yang ada (bukan baris baru). Produk yang tidak ada -> 502.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, qty]
              properties:
                productId: { type: string, example: "271593" }
                variationId: { type: string, example: "" }
                qty: { type: integer, minimum: 1, example: 1 }
      responses:
        "200":
          description: "Berhasil (body `status`: 201)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/CartRow" }
        "502": { $ref: "#/components/responses/Upstream" }

  /carts/items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: ID baris keranjang }
    get:
      tags: [Keranjang]
      summary: Detail satu baris keranjang (untuk halaman checkout)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Product"
                          - properties:
                              qty: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Keranjang]
      summary: Ubah jumlah
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qty]
              properties:
                qty: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/CartRow" }
    delete:
      tags: [Keranjang]
      summary: Hapus baris
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/OkNull" }

  /carts/stock:
    get:
      tags: [Stok Cabang]
      summary: Stok satu cabang untuk keranjang
      description: Tanpa `storeId` = gudang online. `itemIds`/`qtys` sejajar (dipisah koma).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: storeId, in: query, schema: { type: string }, example: store-sda }
        - { name: itemIds, in: query, schema: { type: string }, description: ID baris keranjang, dipisah koma }
        - { name: qtys, in: query, schema: { type: string }, description: Jumlah per baris, dipisah koma }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/BranchStock" }

  /carts/stock/branches:
    get:
      tags: [Stok Cabang]
      summary: Ringkasan stok semua cabang (pemilih toko)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: itemIds, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/BranchSummary" }

  /address/search:
    get:
      tags: [Alamat]
      summary: Cari kecamatan
      description: |
        Tanpa `mode`: area Biteship lengkap dengan kode pos.
        `mode=local`: **langkah 1** pemilih alamat — daftar kecamatan tanpa kode pos (`zip_code` kosong).
      parameters:
        - { name: search, in: query, required: true, schema: { type: string, minLength: 3 }, example: panekan }
        - { name: mode, in: query, schema: { type: string, enum: [local] } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { $ref: "#/components/responses/AreaList" }
        "502": { $ref: "#/components/responses/Upstream" }

  /address/postal-codes:
    get:
      tags: [Alamat]
      summary: Kode pos satu kecamatan
      description: "**Langkah 2** pemilih alamat. Isi `area_id`, atau nama `district` + `city` (+ `province`)."
      parameters:
        - { name: area_id, in: query, schema: { type: string }, example: IDNP11IDNC244IDND2516 }
        - { name: district, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: province, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/AreaList" }
        "404": { $ref: "#/components/responses/Error", description: Kecamatan tidak dikenali kurir }

  /address/store:
    get:
      tags: [Alamat]
      summary: Daftar toko (Ambil di Toko)
      parameters:
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Store" }

  /address/payment:
    get:
      tags: [Alamat]
      summary: Metode pembayaran (per grup)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PaymentGroup" }

  /topsell-area-postal/check-postal-code-is-exist/{postalCode}:
    get:
      tags: [Alamat]
      summary: Apakah kode pos masuk area Topsell
      parameters:
        - { name: postalCode, in: path, required: true, schema: { type: string }, example: "61219" }
      responses:
        "200":
          description: "`data` = true jika masuk area Topsell"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { type: boolean }

  /shippings/methods:
    get:
      tags: [Pengiriman]
      summary: Metode pengiriman
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ShippingMethod" }

  /shippings/options:
    post:
      tags: [Pengiriman]
      summary: Pilihan kurir untuk alamat + keranjang
      description: Semua layanan kurir dari Biteship, termurah dulu. Di area Topsell `price` = 0 (disubsidi), `listPrice` tetap tarif kurir.
      parameters:
        - { name: destination, in: query, schema: { type: string }, description: ID area Biteship }
        - { name: postal_code, in: query, required: true, schema: { type: string }, example: "63352" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductsForRate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ShippingOption" }
        "502": { $ref: "#/components/responses/Upstream" }

  /shippings/price:
    post:
      tags: [Pengiriman]
      summary: Ongkir termurah (versi lama)
      description: Sebelum ada pemilih kurir. Mengembalikan satu angka.
      parameters:
        - { name: destination, in: query, schema: { type: string } }
        - { name: postal_code, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductsForRate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { type: integer, example: 13000 }

  /vouchers/all:
    post:
      tags: [Voucher]
      summary: Daftar voucher untuk keranjang
      description: Tanpa `voucher_type` = voucher belanja (termasuk voucher milik user dari tukar poin). `voucher_type=shipping` = voucher ongkir.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: voucher_type, in: query, schema: { type: string, enum: [shipping] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoucherContext" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Voucher" }

  /vouchers/validate:
    post:
      tags: [Voucher]
      summary: Hitung potongan satu voucher
      description: Voucher ongkir dihitung dari kurir yang dipilih (`courierCode` + `courierServiceCode`), bukan yang termurah.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: voucherID, in: query, required: true, schema: { type: string }, example: v-hemat10 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoucherContext" }
      responses:
        "200":
          description: "`data` = nilai potongan (Rupiah)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { type: integer, example: 50000 }
        "400": { $ref: "#/components/responses/Error", description: Kurir yang dipilih tidak tersedia lagi }
        "404": { $ref: "#/components/responses/Error" }

  /vouchers/me:
    get:
      tags: [Voucher]
      summary: Voucher saya
      description: Voucher milik user (hasil tukar poin) yang belum dipakai dan belum kedaluwarsa.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Voucher" }

  /checkout:
    post:
      tags: [Checkout & Pesanan]
      summary: Buat pesanan
      description: |
        Server menghitung ulang harga, ongkir (untuk kurir yang dipilih), voucher, dan biaya admin.
        Order dibuat dan keranjang dikurangi dalam satu transaksi.
        Respons membawa `redirectURL`: transfer manual -> `/manual?inv=`, QRIS -> `/qr-payment?inv=`, lainnya -> halaman pembayaran.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "200":
          description: Pesanan dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  message: { type: string }
                  redirectURL: { type: string, example: "/manual?inv=INV-LOCAL-MWK4IEVH" }
                  data: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/Error", description: "Keranjang kosong, metode tidak valid, toko belum dipilih, voucher sudah dipakai" }

  /orders:
    get:
      tags: [Checkout & Pesanan]
      summary: Detail pesanan per invoice
      description: Dipakai halaman /manual dan /thankyou. Pending lebih dari 24 jam = `expired`.
      parameters:
        - { name: invoice, in: query, required: true, schema: { type: string }, example: INV-LOCAL-MWK4IEVH }
      responses:
        "200": { $ref: "#/components/responses/OrderResponse" }
        "404": { $ref: "#/components/responses/Error" }

  /orders/history:
    get:
      tags: [Checkout & Pesanan]
      summary: Riwayat pesanan per tab
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: true, schema: { $ref: "#/components/schemas/OrderStatus" } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        "200":
          description: OK (`total` & `totalPage` di luar `data`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  total: { type: integer }
                  totalPage: { type: integer }

  /orders/qr-code:
    get:
      tags: [Checkout & Pesanan]
      summary: Data QRIS untuk pembayaran
      description: Di API lokal string QR tiruan (tidak bisa dibayar).
      parameters:
        - { name: invoice, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          invoice: { type: string }
                          qrString: { type: string }
                          amount: { type: integer }
                          status: { $ref: "#/components/schemas/OrderStatus" }
                          paymentType: { type: string, example: QRIS }
        "400": { $ref: "#/components/responses/Error", description: Order bukan QRIS }

  /orders/tracking:
    get:
      tags: [Checkout & Pesanan]
      summary: Pelacakan paket (halaman /tracking/[invoice])
      description: Ringkasan pesanan + riwayat perjalanan langsung dari Biteship. Status Biteship dalam camelCase.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: invoice, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/OrderTracking" }
        "404": { $ref: "#/components/responses/Error", description: Order tidak ada / kurir belum dipesan }

  /points/balance:
    get:
      tags: [Poin]
      summary: Saldo poin
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          userID: { type: string }
                          activePoints: { type: integer, example: 20000 }
                          expiringSoonPoints: { type: integer }
                          pointToRupiah: { type: number, example: 1 }

  /points/expiring-soon:
    get:
      tags: [Poin]
      summary: Poin yang akan kedaluwarsa
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          totalExpiring: { type: integer }
                          lots:
                            type: array
                            items:
                              type: object
                              properties:
                                lotID: { type: string }
                                remaining: { type: integer }
                                expiresAt: { type: string, format: date-time }

  /points/history:
    get:
      tags: [Poin]
      summary: Riwayat poin
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items: { $ref: "#/components/schemas/PointLedger" }
                          total: { type: integer }
                          totalPages: { type: integer }

  /points/catalog:
    get:
      tags: [Poin]
      summary: Katalog tukar poin
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/RedeemCatalogItem" }

  /points/redeem:
    post:
      tags: [Poin]
      summary: Tukar poin jadi voucher
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [catalogID]
              properties:
                catalogID: { type: string, example: cat-10k }
      responses:
        "200":
          description: Voucher yang didapat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - properties:
                      data: { $ref: "#/components/schemas/Voucher" }
        "400": { $ref: "#/components/responses/Error", description: Poin tidak cukup }

  /dev/orders/{invoice}/status:
    post:
      tags: [Khusus Lokal]
      summary: Ubah status pesanan (tes)
      description: |
        `proses` (= sudah dibayar) memesan kurir pilihan user di Biteship sandbox.
        Tanpa key Biteship, `sent` mengisi resi tiruan.
      parameters:
        - { name: invoice, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/OrderStatus" }
                trackingNumber: { type: string }
                courierName: { type: string }
      responses:
        "200": { description: Status diubah }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token dari `POST /users/verify-otp`.

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Token tidak ada / tidak berlaku
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Upstream:
      description: WooCommerce / Biteship gagal dihubungi
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OkNull:
      description: Berhasil (`data` null)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    UserResponse:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties:
                  data: { $ref: "#/components/schemas/User" }
    OrderResponse:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties:
                  data: { $ref: "#/components/schemas/Order" }
    AreaList:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AddressArea" }
    Recommendations:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        thumbnail: { type: string, description: Bisa kosong bila produk tanpa foto }
                        slug: { type: string }
                        name: { type: string }
                        price: { type: string }
                        regularPrice: { type: string }

  schemas:
    Envelope:
      type: object
      properties:
        status: { type: integer, example: 200 }
        message: { type: string, example: OK }
        data: {}
    Error:
      type: object
      properties:
        status: { type: integer, example: 400 }
        message: { type: string }

    AppSettings:
      type: object
      properties:
        id: { type: string }
        banner_imager: { type: array, items: { type: string } }
        meta_your_pixel: { type: string, description: HTML script pixel iklan }
        body_script: { type: string }

    PhoneBody:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber: { type: string, example: "6281200000001" }
        website: { type: string, description: Honeypot }
    EmailBody:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string }
        phoneNumber: { type: string }
        isEmailValid: { type: boolean }
        points: { type: integer }

    ProductImage:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        src: { type: string }
        alt: { type: string }
    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number, description: Harga coret (asli) }
        regularPrice: { type: number, description: Harga jual yang dibayar }
        categories:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
        images: { type: array, items: { $ref: "#/components/schemas/ProductImage" } }
        variationName: { type: string }
        variationId: { type: string }

    CartRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string }
        variationId: { type: string }
        qty: { type: integer }
    CartItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string }
        variationId: { type: string }
        qty: { type: integer }
        price: { type: string, description: Harga jual per unit }
        regularPrice: { type: string, description: Harga coret }
        name: { type: string }
        stock: { type: integer }
        stockStatus: { type: string, enum: [instock, outofstock] }
        images: { type: array, items: { $ref: "#/components/schemas/ProductImage" } }
    Cart:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/CartItem" } }
        createdAt: { type: string }
        updatedAt: { type: string }

    StockItem:
      type: object
      properties:
        itemId: { type: string }
        productId: { type: string }
        variationId: { type: string }
        sku: { type: string }
        name: { type: string }
        requested: { type: integer }
        available: { type: integer }
        sufficient: { type: boolean }
        unresolved: { type: boolean }
        message: { type: string }
    BranchStock:
      type: object
      properties:
        branchCode: { type: string }
        branchId: { type: integer }
        branchName: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/StockItem" } }
        complete: { type: boolean }
        canCheckout: { type: boolean }
        message: { type: string }
    BranchSummary:
      type: object
      properties:
        storeId: { type: string }
        storeName: { type: string }
        areaName: { type: string }
        address: { type: string }
        branchCode: { type: string }
        available: { type: boolean }
        availableItems: { type: integer }
        totalItems: { type: integer }
        reachable: { type: boolean }
        missingItems: { type: array, items: { $ref: "#/components/schemas/StockItem" } }
        unmonitoredItems: { type: integer }
        stock: { $ref: "#/components/schemas/BranchStock" }

    AddressArea:
      type: object
      properties:
        id: { type: string, description: ID area Biteship (kecamatan atau kecamatan+kode pos) }
        label: { type: string, example: "Panekan, Magetan, Jawa Timur. 63352" }
        province_name: { type: string }
        city_name: { type: string }
        district_name: { type: string }
        subdistrict_name: { type: string }
        zip_code: { type: string, description: Kosong di langkah 1 (mode=local) }
    Store:
      type: object
      properties:
        id: { type: string, example: store-sda }
        name: { type: string }
        address: { type: string }
        storeArea:
          type: object
          properties:
            name: { type: string }
            cityIds: { type: array, items: { type: string } }

    PaymentMethod:
      type: object
      properties:
        id: { type: string, example: pm-qris }
        key: { type: string, example: qris, description: "manual, bca, bni, mandiri, bri, permata, qris, shopeepay, cc" }
        name: { type: string }
        description: { type: string }
        excerpt: { type: string }
        icon: { type: string }
        adminFee: { type: number }
        adminFeeType: { type: string, enum: [fixed, percentage] }
    PaymentGroup:
      type: object
      properties:
        name: { type: string }
        key: { type: string }
        paymentMethods: { type: array, items: { $ref: "#/components/schemas/PaymentMethod" } }

    ShippingMethod:
      type: object
      properties:
        id: { type: string, example: "1" }
        title: { type: string, enum: [Pengiriman Reguler, Diantar ke Alamat, Ambil di Toko] }
        description: { type: string }
        order: { type: integer }
    ShippingOption:
      type: object
      properties:
        courierCode: { type: string, example: jne }
        courierName: { type: string, example: JNE }
        courierServiceCode: { type: string, example: reg }
        courierServiceName: { type: string, example: Reguler }
        serviceType: { type: string, example: standard }
        shippingType: { type: string, example: parcel }
        duration: { type: string, example: "2 - 3 days" }
        price: { type: integer, description: Yang dibayar user (0 di area Topsell) }
        listPrice: { type: integer, description: Tarif asli kurir }
        freeArea: { type: boolean }
    ProductsForRate:
      type: object
      properties:
        product_ids_and_quantities:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: ID produk }
              quantity: { type: integer }
              variationId: { type: string }

    Voucher:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [percent, fixed, shipping] }
        description: { type: string }
        minTransaction: { type: integer }
        discount: { type: number, description: "Persen (type=percent) atau Rupiah" }
        maxDiscount: { type: integer }
        qty: { type: integer }
        usedQty: { type: integer }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        effectiveEndDate: { type: string, format: date-time }
        isAutoApply: { type: boolean }
        isCancellable: { type: boolean }
        fulfillmentType: { type: string, enum: [all, delivery, pickup] }
        productIDs: { type: array, items: {} }
        paymentMethodIDs: { type: array, items: {} }
        variationIDs: { type: array, items: {} }
        isEligible: { type: boolean }
        ineligibleReason: { type: string }
    VoucherContext:
      type: object
      description: Isi keranjang + pengiriman yang sedang dipilih di halaman checkout.
      properties:
        userID: { type: string }
        data:
          type: array
          description: "Baris keranjang: `{ id, qty? }` (validate) atau `{ cartID }` (all)"
          items:
            type: object
            properties:
              id: { type: string }
              cartID: { type: string }
              qty: { type: integer }
        shippingID: { type: string }
        destinationID: { type: string }
        postalCode: { type: string }
        paymentMethodID: { type: string }
        courierCode: { type: string }
        courierServiceCode: { type: string }

    CheckoutRequest:
      type: object
      required: [cartItems, shippingID, paymentMethodID]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        city: { type: string }
        postalCode: { type: string }
        subdistrictID: { type: string }
        destinationID: { type: string, description: ID area Biteship }
        cartItems:
          type: array
          description: "`qty` hanya diisi bila lebih kecil dari jumlah di keranjang (pickup)"
          items:
            type: object
            properties:
              id: { type: string }
              qty: { type: integer }
        excludedCartItems:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
        shippingID: { type: string }
        areaID: { type: string, description: ID toko untuk Ambil di Toko }
        courierCode: { type: string }
        courierServiceCode: { type: string }
        courierServiceName: { type: string }
        voucherID: { type: string }
        shippingVoucherID: { type: string }
        paymentMethodID: { type: string }
        bankAccountName: { type: string }
        bankAccountNumber: { type: string }

    OrderStatus:
      type: string
      enum: [pending, proses, sent, complete, expired]
    Order:
      type: object
      properties:
        id: { type: string }
        invoice: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        total: { type: integer }
        ongkir: { type: integer }
        adminFee: { type: integer }
        voucherID: { type: string }
        voucherDiscount: { type: integer }
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }
        shipping: { $ref: "#/components/schemas/ShippingMethod" }
        area: { $ref: "#/components/schemas/Store" }
        products:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              price: { type: number }
              regularPrice: { type: number }
              variant: { type: string }
              qty: { type: integer }
              images: { type: array, items: { $ref: "#/components/schemas/ProductImage" } }
        createdAt: { type: string, format: date-time }
        paymentSecondsLeft: { type: integer, description: Sisa detik untuk bayar (hanya pending) }
        paymentUrl: { type: string }
        courierCompany: { type: string }
        courierName: { type: string }
        courierServiceName: { type: string }
        trackingNumber: { type: string, description: Nomor resi }
        trackingUrl: { type: string, description: "Halaman tracking: /tracking/<invoice> atau situs kurir" }
        biteshipTrackingID: { type: string }
        biteshipStatus: { type: string }
        biteshipStatusLabel: { type: string }
    OrderTracking:
      type: object
      properties:
        invoice: { type: string }
        orderStatus: { $ref: "#/components/schemas/OrderStatus" }
        courierCompany: { type: string }
        courierName: { type: string }
        courierServiceName: { type: string }
        waybillId: { type: string }
        biteshipStatus: { type: string, example: confirmed }
        biteshipLabel: { type: string, example: "Pesanan dikonfirmasi, menunggu kurir" }
        link: { type: string }
        driverName: { type: string }
        driverPhone: { type: string }
        driverPlateNumber: { type: string }
        originAddress: { type: string }
        destinationAddress: { type: string }
        history:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              label: { type: string }
              note: { type: string }
              updatedAt: { type: string, format: date-time }

    PointLedger:
      type: object
      properties:
        id: { type: string }
        userID: { type: string }
        type: { type: string, enum: [earn, redeem, expire, refund] }
        amount: { type: integer, description: Positif = masuk, negatif = keluar }
        balanceAfter: { type: integer }
        description: { type: string }
        createdAt: { type: string, format: date-time }
    RedeemCatalogItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        pointCost: { type: integer }
        discountValue: { type: integer }
        status: { type: string }
        validityDays: { type: integer }
        minTransaction: { type: integer }
